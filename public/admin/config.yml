backend:
  name: github
  repo: gilang2xx/website-sano
  branch: main
  base_url: https://sanomatrassehat.com
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "before_after"
    label: "Galeri Before & After"
    folder: "content/before-after"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Deskripsi Singkat", name: "desc", widget: "text" }
      - { label: "Foto Sebelum (Before)", name: "beforeImg", widget: "image" }
      - { label: "Foto Sesudah (After)", name: "afterImg", widget: "image" }
      - label: "Tanggal (otomatis -- menentukan urutan, terbaru tampil paling atas)"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        default: "{{now}}"

  - name: "artikel"
    label: "Artikel"
    folder: "content/artikel"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Kategori", name: "category", widget: "string", default: "Edukasi" }
      - label: "Tanggal"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - { label: "Gambar Sampul", name: "image", widget: "image" }
      - { label: "Ringkasan Singkat (muncul di daftar artikel)", name: "desc", widget: "text" }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }
